client_max_body_size 30m;

# Do not log cookies, authorization headers, query strings, or request bodies.
# x_forwarded_for is the normalized value sent upstream; received_* is untrusted input.
log_format yas_xff_json escape=json
  '{"timestamp":"$time_iso8601",'
  '"request_id":"$request_id",'
  '"host":"$host",'
  '"method":"$request_method",'
  '"request_path":"$uri",'
  '"status":$status,'
  '"client_ip":"$remote_addr",'
  '"peer_ip":"$realip_remote_addr",'
  '"x_forwarded_for":"$remote_addr",'
  '"received_x_forwarded_for":"$http_x_forwarded_for",'
  '"upstream":"$upstream_addr"}';
