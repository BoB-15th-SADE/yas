server:
  forward-headers-strategy: framework

spring:
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - SaveSession
            # ForwardedHeaderTransformer consumes XFF for HTTPS/login processing.
            # The private nginx entry overwrites X-Real-IP before reaching this BFF.
            - MapRequestHeader=X-Real-IP, X-Forwarded-For
          routes:
            - id: api
              uri: http://nginx
              predicates:
                - Path=/api/**
              filters:
                - DedupeResponseHeader=Origin Access-Control-Request-Method Access-Control-Request-Headers
                - TokenRelay=
                - StripPrefix=1
            - id: nextjs
              uri: http://storefront-nextjs:3000
              predicates:
                - Path=/**
