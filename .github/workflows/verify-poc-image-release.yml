name: verify-poc-image-release

on:
  push:
    branches: [sade-poc]
    paths:
      - deployment/poc-images-20261027.json
      - .github/workflows/verify-poc-image-release.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [storefront, storefront-bff, backoffice-bff, order, payment, promotion]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull exact digest and verify source revision
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          release = json.loads(pathlib.Path("deployment/poc-images-20261027.json").read_text())
          item = release["images"][os.environ["SERVICE"]]
          tag = next(t for t in item["tags"] if ":sha-" in t)
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", item["digest"])
          reference = tag + "@" + item["digest"]
          subprocess.run(["docker", "pull", "--platform", "linux/amd64", reference], check=True)
          image = json.loads(subprocess.check_output(["docker", "image", "inspect", reference], text=True))[0]
          labels = image.get("Config", {}).get("Labels") or {}
          assert labels.get("org.opencontainers.image.revision") == release["source_revision"]
          result = {"service": os.environ["SERVICE"], "reference": reference,
                    "source_revision": release["source_revision"], "pull_verified": True}
          folder = pathlib.Path("verified-image")
          folder.mkdir()
          (folder / "result.json").write_text(json.dumps(result, indent=2))
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-image-${{ matrix.service }}
          path: verified-image/result.json
          if-no-files-found: error
