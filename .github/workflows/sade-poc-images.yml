# Build the YAS services this fork changed for the SADE PoC lab, once, and push them to GHCR.
# Servers only pull and run these images (BoB-15th-SADE/sade-poc-lab pins them by digest).
# order/payment keep their existing repository-owned packages.
# Other fork builds use yas-poc-<service>, separate from the protected upstream mirror packages.
# Tags: sha-<short> for the exact commit and sade-poc for the branch.
# Same build as YAS's own CI (JDK 25 temurin, Maven with unit tests, the service's Dockerfile).
name: sade-poc-images

on:
  push:
    branches: [sade-poc]
    paths:
      - order/**
      - payment/**
      - payment-paypal/**
      - promotion/**
      - storefront/**
      - storefront-bff/**
      - backoffice-bff/**
      - common-library/**
      - pom.xml
      - .github/workflows/sade-poc-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: order
            image: yas-order
          - service: payment
            image: yas-payment
          - service: promotion
            image: yas-poc-promotion
          - service: storefront-bff
            image: yas-poc-storefront-bff
          - service: backoffice-bff
            image: yas-poc-backoffice-bff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Maven package (with unit tests)
        run: mvn -B -ntp clean package -pl ${{ matrix.service }} -am
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Record immutable image reference
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_METADATA: ${{ steps.meta.outputs.json }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          mkdir -p image-manifest
          python3 - <<'PY'
          import json, os, pathlib, re
          metadata = json.loads(os.environ["IMAGE_METADATA"])
          digest = os.environ["IMAGE_DIGEST"]
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", digest), digest
          image = metadata["tags"][0].rsplit(":", 1)[0]
          manifest = {"service": os.environ["SERVICE"], "image": image,
                      "digest": digest, "source_revision": os.environ["SOURCE_REVISION"],
                      "tags": metadata["tags"]}
          pathlib.Path("image-manifest/image.json").write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: image-manifest-${{ matrix.service }}
          path: image-manifest/image.json
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: storefront
            image: yas-poc-storefront
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
      - id: image
        uses: docker/build-push-action@v6
        with:
          # Dockerfile runs catalog, coupon and React render regression checks, then next build.
          context: ./storefront
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Record immutable image reference
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_METADATA: ${{ steps.meta.outputs.json }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          mkdir -p image-manifest
          python3 - <<'PY'
          import json, os, pathlib, re
          metadata = json.loads(os.environ["IMAGE_METADATA"])
          digest = os.environ["IMAGE_DIGEST"]
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", digest), digest
          image = metadata["tags"][0].rsplit(":", 1)[0]
          manifest = {"service": os.environ["SERVICE"], "image": image,
                      "digest": digest, "source_revision": os.environ["SOURCE_REVISION"],
                      "tags": metadata["tags"]}
          pathlib.Path("image-manifest/image.json").write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: image-manifest-${{ matrix.service }}
          path: image-manifest/image.json
          if-no-files-found: error
