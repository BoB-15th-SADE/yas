# Build the YAS services this fork changed for the SADE PoC lab, once, and push them to GHCR.
# Servers only pull and run these images (BoB-15th-SADE/sade-poc-lab pins them by digest).
#   ghcr.io/bob-15th-sade/yas-<service>:sha-<short>   the exact commit
#   ghcr.io/bob-15th-sade/yas-<service>:sade-poc      latest build of this branch
# Same build as YAS's own CI (JDK 25 temurin, Maven with unit tests, the service's Dockerfile).
name: sade-poc-images

on:
  push:
    branches: [sade-poc]
    paths:
      - order/**
      - payment/**
      - payment-paypal/**
      - common-library/**
      - pom.xml
      - .github/workflows/sade-poc-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [order, payment]   # services with fixes on this branch; the rest run YAS's published images
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Maven package (with unit tests)
        run: mvn -B -ntp clean package -pl ${{ matrix.service }} -am
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/yas-${{ matrix.service }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
