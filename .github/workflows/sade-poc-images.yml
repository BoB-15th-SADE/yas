# Build every YAS service the SADE PoC lab runs and push it to GHCR.
# Servers only pull and run these images (BoB-15th-SADE/sade-poc-lab pins them by digest).
# order/payment keep their existing repository-owned packages.
# Other fork builds use yas-poc-<service>, separate from the protected upstream mirror packages.
# Only services whose folder changed are rebuilt; common-library, pom.xml or this file rebuild all.
# Tags: sha-<short> for the exact commit and sade-poc for the branch.
# Same build as YAS's own CI (JDK 25 temurin, Maven, the service's Dockerfile) but tests do not gate the image.
name: sade-poc-images

on:
  push:
    branches: [sade-poc]
    paths:
      - order/**
      - payment/**
      - payment-paypal/**
      - promotion/**
      - product/**
      - media/**
      - customer/**
      - cart/**
      - rating/**
      - tax/**
      - inventory/**
      - location/**
      - sampledata/**
      - storefront/**
      - storefront-bff/**
      - backoffice/**
      - backoffice-bff/**
      - common-library/**
      - pom.xml
      - .github/workflows/sade-poc-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      java: ${{ steps.pick.outputs.java }}
      frontend: ${{ steps.pick.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          java_all="order payment promotion storefront-bff backoffice-bff product media customer cart rating tax inventory location sampledata"
          frontend_all="storefront backoffice"
          all=false
          changed=""
          if [ "$EVENT" != push ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            all=true
          else
            changed=$(git diff --name-only "$BEFORE" "$SHA")
            if grep -qE '^(common-library/|pom\.xml$|\.github/workflows/sade-poc-images\.yml$)' <<<"$changed"; then all=true; fi
          fi
          pick() {
            for s in $1; do
              if $all || grep -q "^$s/" <<<"$changed" || { [ "$s" = payment ] && grep -q '^payment-paypal/' <<<"$changed"; }; then
                case $s in order|payment) img="yas-$s" ;; *) img="yas-poc-$s" ;; esac
                printf '{"service":"%s","image":"%s"}\n' "$s" "$img"
              fi
            done | jq -sc .
          }
          echo "java=$(pick "$java_all")" >> "$GITHUB_OUTPUT"
          echo "frontend=$(pick "$frontend_all")" >> "$GITHUB_OUTPUT"
          echo "all=$all"; cat "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.java != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.java) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Maven package (tests skipped)
        run: mvn -B -ntp clean package -DskipTests -pl ${{ matrix.service }} -am
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Record immutable image reference
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_METADATA: ${{ steps.meta.outputs.json }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          mkdir -p image-manifest
          python3 - <<'PY'
          import json, os, pathlib, re
          metadata = json.loads(os.environ["IMAGE_METADATA"])
          digest = os.environ["IMAGE_DIGEST"]
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", digest), digest
          image = metadata["tags"][0].rsplit(":", 1)[0]
          manifest = {"service": os.environ["SERVICE"], "image": image,
                      "digest": digest, "source_revision": os.environ["SOURCE_REVISION"],
                      "tags": metadata["tags"]}
          pathlib.Path("image-manifest/image.json").write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: image-manifest-${{ matrix.service }}
          path: image-manifest/image.json
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.frontend) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
      - id: image
        uses: docker/build-push-action@v6
        with:
          # Builds the service Dockerfile as is (next build).
          context: ./${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Record immutable image reference
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_METADATA: ${{ steps.meta.outputs.json }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          mkdir -p image-manifest
          python3 - <<'PY'
          import json, os, pathlib, re
          metadata = json.loads(os.environ["IMAGE_METADATA"])
          digest = os.environ["IMAGE_DIGEST"]
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", digest), digest
          image = metadata["tags"][0].rsplit(":", 1)[0]
          manifest = {"service": os.environ["SERVICE"], "image": image,
                      "digest": digest, "source_revision": os.environ["SOURCE_REVISION"],
                      "tags": metadata["tags"]}
          pathlib.Path("image-manifest/image.json").write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: image-manifest-${{ matrix.service }}
          path: image-manifest/image.json
          if-no-files-found: error
